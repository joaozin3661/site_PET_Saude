{% extends "base.html" %}
{% block title %}Acesso restrito · PET-Saúde Digital UFPI/FMS{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <span class="eyebrow">Área restrita</span>
        <h1>Entrar no painel</h1>
        <p>Use este acesso para enviar materiais, fotos e vídeos para o portal.</p>

        <form method="POST" action="{{ url_for('login') }}" class="form-stack">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" required autocomplete="username">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required autocomplete="current-password">

            <button type="submit" class="btn btn-primary full-button">Entrar</button>
        </form>
    </div>
</section>
{% endblock %}
